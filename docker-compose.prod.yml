# Fixed project name: container and volume names don't depend on the folder name.
name: dino-pew-pew
services:
  dino-pew-pew:
    build: .
    image: dino-pew-pew:latest
    restart: unless-stopped
    # No published ports: only Caddy is reachable from outside.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env, e.g. DOMAIN=dino-pew-pew.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dino-pew-pew
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
